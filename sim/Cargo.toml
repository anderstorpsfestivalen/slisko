[package]
name = "sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Persistent ggez DDP viewer. Kept outside the workspace's default members so
# ordinary host/core tests do not compile the optional graphical stack.
[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ddp-rs = "1.3.0"
ggez = { version = "0.10.0", default-features = false }
config = { version = "0.1.0", path = "../config" }
engine = { path = "../engine" }
