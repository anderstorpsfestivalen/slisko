# ASR 9010

# Physical pixels transmitted across all eight outputs. This includes the four
# sacrificial leading pixels configured as "Skip first LED" in WLED and the
# final unused pixel on port 8.
LEDAmount = 145
Linecards = [
    "a9k-40ge-l",
    "a9k-8t-l",
    "blank",
    "a9k-8t-l",
    "a9k-rsp400-se",
    "a9k-rsp400-se-2",
    "a9k-8t-l",
    "blank",
    "a9k-8t-l",
    "a9k-40ge-l",
]
Mapping = [
    { gen = 1 }, # Port 1: skip first LED
    { card = 0 },
    { card = 1 },
    { card = 3 },
    { gen = 1 }, # Port 4: skip first LED
    { card = 4 },
    { gen = 1 }, # Port 5: skip first LED
    { card = 5 },
    { card = 6 },
    { card = 7 },
    { card = 8 },
    { gen = 1 }, # Port 8: skip first LED
    { card = 9 },
    { gen = 1 }, # Port 8 has 42 logical pixels; the linecard uses 41
]
Patterns = ["greenstatus", "a9k-40ge-l", "a9k-8t-l", "a9k-rsp440-tr"]
#Patterns = ["mapper"]
Buttons = [
    { pin = "GPIO23", action = [
        "greenstatus",
        "a9k-8t-l",
        "a9k-40ge-l",
        "a9k-rsp440-tr",
    ] },
    { pin = "GPIO24", action = [
    ] },
    { pin = "GPIO25", action = [
    ] },
    { pin = "GPIO16", action = [
    ] },
]

[traffic_shaper]
enabled = true
peak_start = 17
peak_end = 22
low_start = 2
low_end = 7
peak_factor = 1.0
low_factor = 0.2

[output.ddp]
host = "127.0.0.1"
port = 4048

[ledinfo]
type = "WS2815"
mapping = [
    { data = 1,  range = "0-42" },
    { data = 2,  range = "42-51" },
    { data = 3,  range = "51-60" },
    { data = 4,  range = "60-72" },
    { data = 5,  range = "72-84" },
    { data = 12, range = "84-93" },
    { data = 14, range = "93-102" },
    { data = 15, range = "102-145" },
]

# Physical output sequence (half-open ranges)
# GPIO 1:  skip + a9k40       0-42
# GPIO 2:  8t                42-51
# GPIO 3:  8t                51-60
# GPIO 4:  skip + rsp        60-72
# GPIO 5:  skip + rsp        72-84
# GPIO 12: 8t                84-93
# GPIO 14: 8t                93-102
# GPIO 15: skip + a9k40 + 1 102-145
